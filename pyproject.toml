[project]
name = "inter-agent-guard-demo"
version = "0.1.0"
description = "Validation + production-style multi-agent demo for inter-agent-guard (PyPI)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "inter-agent-guard[langgraph]>=1.1.0",
    "langgraph>=0.2",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]

# Scripts-only demo; no importable package directory to install as root.
[tool.poetry]
package-mode = false

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
