[project]
name = "intelbrief"
version = "1.0.0"
description = "IntelBrief — production competitive intelligence demo secured by AgentGuard"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "AgentGuard Demo" }]
dependencies = [
    "inter-agent-guard[langgraph]>=1.1.0",
    "langgraph>=0.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "openai>=1.0",
    "python-multipart>=0.0.9",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
intelbrief-api = "intelbrief.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["intelbrief*"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
