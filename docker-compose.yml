services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      LLM_BACKEND: ollama
      OLLAMA_BASE_URL: http://ollama:11434/v1
      LLM_MODEL: llama3.2
      REQUIRE_ML_MODEL: "true"
      AGENTGUARD_MODE: enforce
    volumes:
      - ./data:/app/data
    depends_on:
      ollama:
        condition: service_healthy
    command: >
      sh -c "python install_model.py && python -m intelbrief"

  ui:
    build: .
    ports:
      - "8501:8501"
    environment:
      INTELBRIEF_API_URL: http://api:8000/api/v1
    depends_on:
      - api
    command: streamlit run ui/streamlit_app.py --server.address 0.0.0.0 --server.port 8501

  pull-model:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: >
      sh -c "ollama pull llama3.2"
    environment:
      OLLAMA_HOST: http://ollama:11434

volumes:
  ollama_data:
